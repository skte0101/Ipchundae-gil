      #helpBtn {

        right: 20px;
        width: 45px;

        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5); /* 반투명 배경 */
        z-index: 100;
        align-items: center;
        justify-content: center;

        position: relative;

          margin-bottom: 25px;
        }
        .controls {
          gap: 15px;
        }

      let current = 0;

      /* --- [수정] 페이지 표시 함수 (애니메이션 및 페이지 번호 추가) --- */
      function showPage(i) {
        page.style.opacity = 0; // 페이드 아웃

        setTimeout(() => {
          // innerText 대신 innerHTML 사용 (제목 태그 적용을 위해)
          page.innerHTML = pages[i];
          page.scrollTop = 0; // 스크롤 맨 위로
          page.style.opacity = 1; // 페이드 인

          // 페이지 번호 갱신
          pageNumberDisplay.innerText = `${i + 1} / ${pages.length}`;
        }, 400); // 이전보다 약간 빠르게
      }

      /* 책 열기 */
      function openBook() {
        viewer.style.display = "flex";
        showPage(current);
      }

      /* 페이지 이동 */
      function next() {
        if (current < pages.length - 1) {
          current++;
          showPage(current);
        }
      }

      function prev() {
        if (current > 0) {
          current--;
          showPage(current);
        }
      }

      /* 책 닫기 */
      function closeBook() {
        page.style.opacity = 0;

        setTimeout(() => {
          viewer.style.display = "none";
        }, 400);
      }
    </script>
